name: Build
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build for ${{ matrix.binarySuffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - binarySuffix: linux-amd64
            arch: x86_64
            distro: alpine_latest
          - binarySuffix: linux-arm64
            arch: aarch64
            distro: alpine_latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
      - name: Build binary
        uses: d1ceward/run-on-arch-action@29ad87adc44eb4e84293df00b53e7f49c148cab2 # master
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          dockerRunArgs: --volume "${PWD}/repository:/repository"
          run: |
            apk update
            apk add make g++ openssl-dev openssl-libs-static yaml-static zlib-static pcre2-static gc-static curl crystal shards

            export CRYSTAL_DIR=/tmp/crystal
            export CRYSTAL_VERSION=$(cat /repository/.crystal-version)

            mkdir -p $CRYSTAL_DIR
            cd $CRYSTAL_DIR

            curl -s -L --retry 15 --retry-delay 2 "https://github.com/crystal-lang/crystal/archive/${CRYSTAL_VERSION}.tar.gz" | tar xz -C $CRYSTAL_DIR --strip-component=1

            # Get the latest available LLVM version in Alpine
            export APK_LLVM_VERSION=$(apk search 'llvm*-dev' | grep -o 'llvm[0-9]*-dev' | sed 's/[^0-9]*//g' | sort -nr | head -n1)
            apk add "llvm${APK_LLVM_VERSION}-dev" "llvm${APK_LLVM_VERSION}-static"

            make

            cd /repository
            shards install --production -v
            /tmp/crystal/bin/crystal build --static --no-debug --verbose --release -o ./shellyplug-exporter src/shellyplug_exporter_run.cr

            mv shellyplug-exporter shellyplug-exporter-${{ matrix.binarySuffix }}
      - name: Upload binaries to action artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shellyplug-exporter-${{ matrix.binarySuffix }}
          path: ./repository/shellyplug-exporter-${{ matrix.binarySuffix }}
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Create draft release with binaries
        uses: d1ceward/release-upload-action@2a29f316751112412c8ec36babaa07808e030646 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./shellyplug-exporter-linux-amd64/shellyplug-exporter-linux-amd64
            ./shellyplug-exporter-linux-arm64/shellyplug-exporter-linux-arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          logout: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            d1ceward/shellyplug-exporter
            ghcr.io/d1ceward/shellyplug-exporter
      - name: Build and push to DockerHub and GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          repository: d1ceward/shellyplug-exporter
